name: Sync Changes to Org Repo PR

on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', '.github/**']

permissions:
  contents: write

jobs:
  sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App Token for Org Installation
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          installation-id: ${{ secrets.INSTALLATION_ID }}

      - name: Clone org repo and sync changes
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git config --global user.name "Dev Sync Bot"
          git config --global user.email "dev-sync-bot@users.noreply.github.com"

          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ secrets.ORG_REPO }}.git org-repo
          cd org-repo
          git checkout dev

          rsync -av --exclude='.git' --exclude='.github' ../ ./

          BRANCH_NAME="sync/dev-$(git rev-parse --short ${{ github.sha }})"
          git checkout -b $BRANCH_NAME
          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Sync: ${{ github.event.head_commit.message }}"
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          BRANCH_NAME="sync/dev-$(git rev-parse --short ${{ github.sha }})"
          gh pr create \
            --repo ${{ secrets.ORG_REPO }} \
            --title "Sync: Update from personal dev" \
            --body "Automated sync from personal dev branch.

          Commit: ${{ github.sha }}
          Message: ${{ github.event.head_commit.message }}" \
            --head $BRANCH_NAME \
            --base dev || echo "PR already exists"
        continue-on-error: true