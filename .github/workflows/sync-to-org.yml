name: Sync Changes to Org Repo PR

on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', '.github/**']

permissions:
  contents: write

jobs:
  sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App Token
        id: generate_token
        uses: tibdex/github-app-token@v2.1.0
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Clone org repo and prepare changes
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git config --global user.name "Dev Sync Bot"
          git config --global user.email "dev-sync-bot@users.noreply.github.com"

          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ secrets.ORG_REPO }}.git org-repo
          cd org-repo
          git checkout dev

          # Sync files (exclude .git and .github)
          rsync -av --exclude='.git' --exclude='.github' ../ ./ 

          BRANCH_NAME="sync/dev-from-personal-${{ github.sha }}"

          git checkout -b $BRANCH_NAME
          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Sync: ${{ github.event.head_commit.message }}" || exit 0
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          BRANCH_NAME="sync/dev-from-personal-${{ github.sha }}"
          gh pr create \
            --repo ${{ secrets.ORG_REPO }} \
            --title "Sync: Update from personal dev" \
            --body "Automated sync from personal dev branch.

          Commit: ${{ github.sha }}
          Message: ${{ github.event.head_commit.message }}" \
            --head $BRANCH_NAME \
            --base dev \
            --draft false || echo "PR already exists or failed (non-fatal)"
        continue-on-error: true  # Avoid failing if PR exists