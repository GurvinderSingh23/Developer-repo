name: Sync Changes to Org Repo PR

on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', '.github/**']

permissions:
  contents: write   # needed for checkout & push

jobs:
  sync-pr:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout your personal repo ───────────────────────
      - name: Checkout personal repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Generate token **using the App ID** ───────────────
      - name: Generate GitHub App token (App ID)
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}          # ← **numeric App ID**
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ secrets.ORG_OWNER }}        # ← org where the app is installed

      # ── 3. Clone org repo & copy changes ─────────────────────
      - name: Sync files to org repo
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git config --global user.name "Dev Sync Bot"
          git config --global user.email "dev-sync-bot@users.noreply.github.com"

          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ secrets.ORG_REPO }}.git org-repo
          cd org-repo
          git checkout dev

          # copy everything except .git and .github
          rsync -av --exclude='.git' --exclude='.github' ../ ./

          SHORT_SHA=$(git rev-parse --short ${{ github.sha }})
          BRANCH="sync/dev-$SHORT_SHA"

          git checkout -b $BRANCH
          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Sync: ${{ github.event.head_commit.message }}"
          git push origin $BRANCH

      # ── 4. Open a PR in the org repo ────────────────────────
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short ${{ github.sha }})
          BRANCH="sync/dev-$SHORT_SHA"

          gh pr create \
            --repo ${{ secrets.ORG_REPO }} \
            --title "Sync: dev → org" \
            --body "Automated sync from personal dev.

          Commit: ${{ github.sha }}
          Message: ${{ github.event.head_commit.message }}" \
            --head $BRANCH \
            --base dev \
            || echo "PR already exists or failed – ignored"
        continue-on-error: true