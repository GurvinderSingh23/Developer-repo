name: Sync Changes to Org Repo PR

on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', '.github/**']  # Optional: Ignore docs or workflow changes

permissions:
  contents: write
  id-token: write  # Required for OIDC with GitHub App token

jobs:
  sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commits

      - name: Generate GitHub App Installation Token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: Iv23liXbngw3ZhMV6Bjr
          private-key: 
          installation-id: 93994820

      - name: Clone org repo and prepare changes
        env:
          GH-TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git config --global user.name "Dev Sync Bot"
          git config --global user.email "actions@github.com"
          
          # Clone org repo
          git clone https://x-access-token:${GH-TOKEN}@github.com/YASH-Tech-Org/YASH-Org-PR-Sync.git org-repo
          cd org-repo
          
          # Checkout target branch
          git checkout dev
          
          # Copy all changes from personal repo (adjust paths if syncing subsets, e.g., cp -r ../src ./src)
          rsync -av --exclude='.git' --exclude='.github' ../ ./  # Syncs everything except git dirs
          
          # Create new branch for PR (e.g., based on commit SHA)
          BRANCH_NAME="sync-from-personal-${{ github.sha }}"
          git checkout -b $BRANCH_NAME
          
          # Stage, commit, and push
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync changes from personal repo: ${{ github.event.head_commit.message }}"
          git push origin $BRANCH_NAME

      - name: Create PR in org repo
        env:
          GH-TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          BRANCH_NAME="sync-from-personal-${{ github.sha }}"
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH-TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ secrets.ORG_REPO }}/pulls \
            -d '{
              "title": "Sync dev changes from personal repo",
              "head": "'$BRANCH_NAME'",
              "base": "dev",
              "body": "Automated sync from personal dev branch.\n\n- Commit: ${{ github.sha }}\n- Changes: ${{ github.event.head_commit.message }}",
              "draft": false
            }'